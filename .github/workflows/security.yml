name: DevSecOps Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-analysis:
    name: SAST Analysis (Bandit & Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 01-python-security-automation-ml/requirements.txt
          pip install -r 03-flask-secure-api/requirements.txt
          pip install bandit semgrep

      - name: Run Bandit SAST
        run: |
          bandit -r 01-python-security-automation-ml 03-flask-secure-api -ll -ii

      - name: Run Semgrep SAST
        run: |
          semgrep scan --config p/python --config p/owasp-top-ten
